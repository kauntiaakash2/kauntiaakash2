<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1000"
  height="220"
  viewBox="0 0 1000 220"
  role="img"
  aria-labelledby="title desc"
>
  <title id="title">Akash Agarwal — Pixel Identity</title>
  <desc id="desc">
    Transparent retro pixel banner with adaptive light and dark theme.
  </desc>

  <defs>

    <!-- =========================================
         THEME
         Light device -> dark artwork
         Dark device  -> light artwork
    ========================================== -->

    <style>
      :root {
        --ink: #1f2328;
        --muted: #656d76;
        --faint: #afb8c1;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --ink: #f0f6fc;
          --muted: #8b949e;
          --faint: #30363d;
        }
      }

      .px {
        fill: var(--ink);
        shape-rendering: crispEdges;
      }

      .muted {
        fill: var(--muted);
        shape-rendering: crispEdges;
      }

      .faint {
        fill: var(--faint);
        shape-rendering: crispEdges;
      }

      .rule {
        stroke: var(--faint);
        shape-rendering: crispEdges;
      }

      text {
        font-family:
          ui-monospace,
          SFMono-Regular,
          Menlo,
          Monaco,
          Consolas,
          "Liberation Mono",
          "Courier New",
          monospace;
      }

      .micro {
        fill: var(--muted);
        font-size: 10px;
        letter-spacing: 2px;
      }

      .label {
        fill: var(--ink);
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 2.5px;
      }

      /* =========================================
         PIXEL NAME REVEAL
      ========================================== */

      .letter {
        opacity: 0;
        animation: pixel-in .12s steps(1, end) forwards;
      }

      .l0  { animation-delay: .10s; }
      .l1  { animation-delay: .18s; }
      .l2  { animation-delay: .26s; }
      .l3  { animation-delay: .34s; }
      .l4  { animation-delay: .42s; }

      .l5  { animation-delay: .58s; }
      .l6  { animation-delay: .66s; }
      .l7  { animation-delay: .74s; }
      .l8  { animation-delay: .82s; }
      .l9  { animation-delay: .90s; }
      .l10 { animation-delay: .98s; }
      .l11 { animation-delay: 1.06s; }

      @keyframes pixel-in {
        to {
          opacity: 1;
        }
      }

      /* =========================================
         CURSOR
      ========================================== */

      .cursor {
        fill: var(--ink);
        animation: cursor-blink 1s steps(1, end) infinite;
      }

      @keyframes cursor-blink {
        0%,
        49% {
          opacity: 1;
        }

        50%,
        100% {
          opacity: 0;
        }
      }

      /* =========================================
         ONLINE INDICATOR
      ========================================== */

      .online {
        animation: online-pulse 1.8s steps(2, end) infinite;
      }

      @keyframes online-pulse {
        0%,
        100% {
          opacity: .3;
        }

        50% {
          opacity: 1;
        }
      }

      /* =========================================
         DATA SIGNAL
      ========================================== */

      .data {
        fill: var(--faint);
        opacity: .28;
      }

      .scanner {
        fill: var(--ink);
        animation: scan 3.2s steps(16, end) infinite;
      }

      @keyframes scan {
        0% {
          transform: translateX(0);
        }

        100% {
          transform: translateX(720px);
        }
      }

      /* =========================================
         REDUCED MOTION
      ========================================== */

      @media (prefers-reduced-motion: reduce) {
        .letter {
          opacity: 1;
          animation: none;
        }

        .cursor,
        .online,
        .scanner {
          animation: none;
        }
      }
    </style>


    <!-- =========================================
         5 × 7 PIXEL FONT
    ========================================== -->

    <g id="A" class="px">
