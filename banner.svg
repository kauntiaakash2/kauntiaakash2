<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1000"
  height="220"
  viewBox="0 0 1000 220"
  role="img"
  aria-labelledby="title desc"
>

  <title id="title">
    Akash Agarwal — Pixel Identity
  </title>

  <desc id="desc">
    Transparent retro pixel banner with adaptive light and dark theme.
  </desc>


  <defs>

    <style>

      /* ==================================================
         THEME

         LIGHT SYSTEM THEME -> DARK ARTWORK
         DARK SYSTEM THEME  -> LIGHT ARTWORK
      ================================================== */

      :root {
        --ink: #1f2328;
        --muted: #656d76;
        --faint: #afb8c1;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --ink: #f0f6fc;
          --muted: #8b949e;
          --faint: #30363d;
        }
      }


      /* ==================================================
         BASE PIXEL STYLING
      ================================================== */

      .px {
        fill: var(--ink);
        shape-rendering: crispEdges;
      }

      .muted {
        fill: var(--muted);
        shape-rendering: crispEdges;
      }

      .faint {
        fill: var(--faint);
        shape-rendering: crispEdges;
      }

      .rule {
        stroke: var(--faint);
        shape-rendering: crispEdges;
      }


      /* ==================================================
         TEXT
      ================================================== */

      text {
        font-family:
          ui-monospace,
          SFMono-Regular,
          Menlo,
          Monaco,
          Consolas,
          "Liberation Mono",
          "Courier New",
          monospace;
      }

      .micro {
        fill: var(--muted);
        font-size: 10px;
        letter-spacing: 2px;
      }

      .label {
        fill: var(--ink);
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 2.5px;
      }


      /* ==================================================
         STATIC DATA RAIL
      ================================================== */

      .data {
        fill: var(--faint);
        opacity: 0.28;
      }

    </style>


