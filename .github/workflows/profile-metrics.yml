name: Update Profile Metrics

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Collect GitHub metrics
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          USERNAME="kauntiaakash2"

          ISSUES=$(gh api -X GET search/issues \
            -f q="user:${USERNAME} is:open is:issue" \
            --jq '.total_count')

          PRS=$(gh api -X GET search/issues \
            -f q="user:${USERNAME} is:open is:pr" \
            --jq '.total_count')

          TOP=$(gh api --paginate \
            "/users/${USERNAME}/repos?per_page=100&type=owner" \
            --jq '.[] | select(.fork == false) | "\(.stargazers_count)\t\(.name)"' \
            | sort -nr \
            | head -n 1)

          TOP_STARS=$(echo "$TOP" | cut -f1)
          TOP_REPO=$(echo "$TOP" | cut -f2-)

          FOLLOWERS=$(gh api "users/${USERNAME}" --jq '.followers')

          mkdir -p metrics

          jq -n \
            --argjson issues "$ISSUES" \
            --argjson prs "$PRS" \
            --argjson followers "$FOLLOWERS" \
            --argjson top_stars "$TOP_STARS" \
            --arg top_repo "$TOP_REPO" \
            --arg top_star "${TOP_REPO} · ${TOP_STARS}" \
            '{
              issues: $issues,
              prs: $prs,
              followers: $followers,
              top_repo: $top_repo,
              top_stars: $top_stars,
              top_star: $top_star
            }' > metrics/profile.json

      - name: Commit metrics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add metrics/profile.json

          if ! git diff --cached --quiet; then
            git commit -m "chore: update profile metrics"
            git push
          fi
