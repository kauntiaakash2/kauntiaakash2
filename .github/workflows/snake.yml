name: Generate Contribution Animations

on:
  schedule:
    - cron: "0 0 * * *"

  workflow_dispatch:

  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # -----------------------------
      # Generate Snake
      # -----------------------------
      - name: Generate GitHub Snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark
            dist/ocean.gif?color_snake=orange&color_dots=#bfd6f6,#8dbdff,#64a1f4,#4b91f1,#3c7dd9

      # IMPORTANT:
      # Snake Docker action may leave dist owned by root
      - name: Fix dist permissions
        run: |
          sudo chown -R "$(id -u):$(id -g)" dist
          chmod -R u+rwX dist

      # -----------------------------
      # Generate Pac-Man
      # -----------------------------
      - name: Generate Pac-Man Contribution Graph
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }}
          games: "pacman"

      # -----------------------------
      # Show generated files
      # -----------------------------
      - name: Verify generated files
        run: |
          echo "Generated files:"
          ls -lah dist/

      # -----------------------------
      # Publish everything
      # -----------------------------
      - name: Deploy to output branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: output
          commit_message: "Update contribution animations [skip ci]"
